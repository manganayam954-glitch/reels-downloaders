name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install poetry
        run: pipx install poetry==1.8.3
      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi
      - name: Compile-check Python sources
        run: poetry run python -m compileall app
      - name: Smoke-test FastAPI app imports
        run: |
          poetry run python -c "from app.main import app; \
          assert any(getattr(r, 'path', '') == '/api/info' for r in app.routes), 'route /api/info missing'; \
          print('backend ok')"

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
